name: Sync eBUS configurations

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Check out official eBUS configurations
        uses: actions/checkout@v4
        with:
          repository: eBUS/ebus.github.io
          path: upstream
          persist-credentials: false
      - name: Mirror CSV files and add recoVAIR for VR32
        run: python3 scripts/sync.py
      - name: Commit updates and keep the schedule active
        id: changes
        run: |
          git add site
          if git diff --cached --quiet -- site; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

          current_month=$(date -u +%Y-%m)
          if [[ ! -f .github/last-sync-month || $(cat .github/last-sync-month) != "$current_month" ]]; then
            printf '%s\n' "$current_month" > .github/last-sync-month
            git add .github/last-sync-month
          fi

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync eBUS configurations"
            git push
          fi
      - name: Upload GitHub Pages files
        if: steps.changes.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        if: steps.changes.outputs.site_changed == 'true'
        uses: actions/deploy-pages@v4
