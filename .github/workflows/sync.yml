name: Sync eBUS configurations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Check out official eBUS configurations
        uses: actions/checkout@v4
        with:
          repository: eBUS/ebus.github.io
          path: upstream
          persist-credentials: false
      - name: Mirror CSV files and add recoVAIR for VR32
        run: python3 scripts/sync.py
      - name: Commit updated CSV files
        run: |
          git add site
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync eBUS configurations"
            git push
          fi
      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

